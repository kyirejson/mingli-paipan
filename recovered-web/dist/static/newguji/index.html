<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="color-scheme" content="light dark"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
  <title>智能古籍参考</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #faf7f2 !important;
      color: #2b2823;
    }
    .novip-box { display: none !important; }
    /* 删掉“智能古籍参考”与“共11部经典古籍”，整体上移 */
    .guji-main-root .title { display: none !important; }
    .guji-guide-bar { display: none !important; }
    .guji-main-root {
      background-color: #faf7f2 !important;
      padding-top: 0 !important;
    }
    .guji-main-root .box-swipe {
      background-color: #faf7f2 !important;
      margin-top: 0 !important;
      height: 3.5rem !important;
    }
    .guji-main-root .box-swipe .book-swipe-item {
      padding-top: 0.25rem !important;
    }
    .guji-main-root .box-tips {
      background-color: #f4efe4 !important;
      border: 1px solid #e3d9c8 !important;
      border-radius: 0.2rem !important;
      margin: 0.25rem 0.4rem 0.4rem !important;
    }
    .guji-main-root .guji-box-tabs {
      background-color: #faf7f2 !important;
    }
    .guji-main-root .box-content {
      background-color: #faf7f2 !important;
    }
    .guji-main-root .box-content .tipss {
      background-color: #faf7f2 !important;
    }
    .guji-arrow-btn {
      background: #faf7f2 !important;
      border-color: #b2955d !important;
    }
    * { --img_shuiyin: none !important; --img_shuiyin_dark: none !important; }
    .content, body, html { background-image: none !important; }
  </style>
  <script defer="defer" src="./chunk-vendors.js"></script>
  <script defer="defer" src="./index.js"></script>
  <link href="./chunk-vendors.css" rel="stylesheet">
  <link href="./index.css" rel="stylesheet">
</head>
<body>
  <div id="app"></div>
</body>
</html>
