<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="color-scheme" content="light dark"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
  <title>智能古籍参考</title>
  <style>
    :root{color-scheme:light;--paper:#f5f1e9;--surface:#fbf8f1;--ink:#233b33;--accent:#23483b;--on-accent:#fbf8f1;--line:#dcded2;--caption:#687269}
    html[data-theme=dark]{color-scheme:dark;--paper:#18231e;--surface:#202e27;--ink:#e2e8dc;--accent:#afd0b4;--on-accent:#1c3025;--line:#3b4d40;--caption:#a3b2a5}
    html,body{margin:0;padding:0;background:var(--paper)!important;color:var(--ink)}
    .guji-main-root .title,.guji-guide-bar{display:none!important}
    .guji-main-root{background:var(--paper)!important;padding-top:0!important}
    .guji-main-root .box-swipe{background:var(--paper)!important;margin-top:0!important;height:3.5rem!important}
    .guji-main-root .box-swipe .book-swipe-item{padding-top:.25rem!important}
    .guji-main-root .box-swipe .book-swipe-item>span{color:var(--ink)!important}
    .guji-main-root .box-tips{background:var(--surface)!important;border:1px solid var(--line)!important;border-radius:.2rem!important;margin:.25rem .4rem .4rem!important}
    .guji-main-root .box-tips span{color:var(--ink)!important}
    .guji-main-root .guji-box-tabs,.guji-main-root .box-content,.guji-main-root .box-content .tipss{background:var(--paper)!important;color:var(--ink)!important}
    .guji-main-root .guji_box-tabs span{color:var(--caption)!important}
    .guji-main-root .guji_box-tabs .sel{background:transparent!important;color:var(--accent)!important;border-color:var(--accent)!important;font-weight:600}
    .guji-arrow-btn{background:var(--surface)!important;border-color:var(--line)!important;color:var(--accent)!important}
    .guji-main-root .guji_box-tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:0}.guji-main-root .guji_box-tabs>span{flex:none;white-space:nowrap}
    .guji-main-root .box-content .shuji{min-width:0}.guji-main-root #bookbox{display:block;width:100%;border:0}
    .guji-source,.guji-notice,.guji-load-error{margin:8px 14px;font:13px/1.7 system-ui,sans-serif;color:var(--caption);overflow-wrap:anywhere}
    .guji-source{display:none}.guji-notice:empty{display:none}.guji-load-error{padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px}.guji-load-error p{margin:0 0 8px}
    .guji-load-error button{padding:8px 18px;min-height:38px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--accent);font:inherit}
  </style>
  <script defer="defer" src="./chunk-vendors.js"></script>
  <script defer="defer" src="./catalog.js"></script>
  <script defer="defer" src="./catalogue-rules.js"></script>
  <script defer="defer" src="./public-sources.js"></script>
  <script defer="defer" src="./reader.js"></script>
  <script defer="defer" src="./index.js"></script>
  <link href="./chunk-vendors.css" rel="stylesheet">
  <link href="./index.css" rel="stylesheet">
</head>
<body>
  <div id="app"></div>
</body>
</html>
