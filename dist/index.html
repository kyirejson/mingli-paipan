    window.hwversion = 0;
    function handleTag() {
      var key = 'tag';
      var value = '';
      try {
        var urlObj = new URL(location.href);
        value = urlObj.searchParams.get(key) || '';
        if (!value) {
          var hash = urlObj.hash;
          if (hash.indexOf('?') >= 0) {
            var queryStr = hash.split('?')[1];
            var params = new URLSearchParams(queryStr);
            value = params.get(key) || '';
          }
        }
      } catch (e) {}
      return value;
    }
    window.handleTag = handleTag;

    // Keep the same document alive while a book opens another app screen.
    (function() {
      var suspended = null;
      function getStore() {
        var app = document.getElementById('app');
        return app && app.__vue__ && app.__vue__.$store;
      }
      function getNodes() {
        var store = getStore();
        var book = store && store.state && store.state.book;
        return {
          store: store,
          iframe: document.getElementById('bookIframe') ||
            (store && store.getters && store.getters.bookIframe) ||
            (book && book.bookIframe) || (suspended && suspended.iframe),
          loading: document.getElementById('bookLoading') ||
            (book && book.bookLoading) || (suspended && suspended.loading)
        };
      }
      function saveStyle(node) {
        return node && { display: node.style.display, pointerEvents: node.style.pointerEvents };
      }
      function hide(node) {
        if (node) {
          node.style.display = 'none';
          node.style.pointerEvents = 'none';
        }
      }
      function restore(node, style) {
        if (!node) return;
        if (!document.body.contains(node)) document.body.appendChild(node);
        style = style || saveStyle(node);
        node.style.display = style.display !== 'none' ? style.display : '';
        node.style.pointerEvents = style.pointerEvents !== 'none' ? style.pointerEvents : '';
      }
      window.__WZBZ_BOOK_IFRAME__ = {
        suspend: function() {
          var nodes = getNodes();
          if (!nodes.iframe) return false;
          if (!suspended || suspended.iframe !== nodes.iframe) {
            suspended = {
              iframe: nodes.iframe,
              iframeStyle: saveStyle(nodes.iframe),
              loading: nodes.loading,
              loadingStyle: saveStyle(nodes.loading)
            };
          }
          nodes.iframe.classList.add('hideClass');
          hide(nodes.iframe);
          // Leave the loading class under Vuex/onload control while hidden.
          hide(nodes.loading);
          return true;
        },
        resume: function() {
          var nodes = getNodes();
          if (!nodes.iframe) return false;
          var snapshot = suspended && suspended.iframe === nodes.iframe ? suspended : null;
          restore(nodes.iframe, snapshot && snapshot.iframeStyle);
          nodes.iframe.classList.remove('hideClass');
          restore(nodes.loading, snapshot && snapshot.loadingStyle);
          suspended = null;
          return true;
        },
        close: function() {
          var nodes = getNodes();
          var book = nodes.store && nodes.store.state && nodes.store.state.book;
          var frames = [nodes.iframe, book && book.bookIframe, suspended && suspended.iframe];
          var loaders = [nodes.loading, book && book.bookLoading, suspended && suspended.loading];
          var hadReader = !!nodes.iframe;
          if (nodes.store) nodes.store.dispatch('book/closeBookIframe');
          frames.forEach(function(iframe, index) {
            if (iframe && frames.indexOf(iframe) === index) {
              iframe.onload = null;
              iframe.remove();
              iframe.src = 'about:blank';
            }
          });
          loaders.forEach(function(loading, index) {
            if (loading && loaders.indexOf(loading) === index) loading.remove();
          });
          localStorage.removeItem('wzbz_bookIframe');
          suspended = null;
          return hadReader;
        }
      };
      function syncBookIframeState() {
        var path = location.hash.split('?')[0];
        var isBook = /\/(?:wzbook|school\/my)(?:\/|$)/i.test(path);
        window.__WZBZ_BOOK_IFRAME__[isBook ? 'resume' : 'suspend']();
      }
      window.addEventListener('hashchange', syncBookIframeState);
      window.addEventListener('popstate', syncBookIframeState);
    })();
  </script>
